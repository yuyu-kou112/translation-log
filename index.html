<!DOCTYPE html>
<!--
  翻訳記録表 - 更新履歴
  v1.0  初回リリース（日本語→英語翻訳、日付ごとの記録一覧）
  v1.1  Service Workerによるキャッシュ追加（2回目以降の表示を高速化）
  v1.2  英語テキストを拡大表示、読み上げ(TTS)ボタンを追加
  v1.3  Enterキーで翻訳を実行できるように対応
  v1.4  スマホ(日本語IME)でもEnterキーの翻訳が確実に動くよう修正(beforeinput方式に変更)
  v1.5  タイトル横にバージョン表示を追加
  v1.6  翻訳エンジンをGoogle翻訳相当のものに変更(より自然な訳に)、英訳のコピー機能を追加
  v1.7  「解説」ボタンを追加(文中の主な単語の意味を英英辞書+簡易和訳で表示、無料版)
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻訳記録表</title>
<link rel="preconnect" href="https://translate.googleapis.com">
<link rel="preconnect" href="https://api.dictionaryapi.dev">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="翻訳記録表">
<meta name="theme-color" content="#4c6ef5">
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --accent: #4c6ef5;
    --accent-dark: #3b5bdb;
    --text: #1f2430;
    --text-sub: #6b7280;
    --border: #e5e7eb;
    --ja: #eef2ff;
    --en: #f0fdf4;
    --en-text: #166534;
    --ja-text: #3730a3;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .version-badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-sub);
    background: #eef0f4;
    border: 1px solid var(--border);
    padding: 2px 9px;
    border-radius: 999px;
    letter-spacing: .02em;
  }
  .subtitle {
    color: var(--text-sub);
    font-size: 13px;
    margin: 0 0 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  textarea {
    width: 100%;
    min-height: 84px;
    resize: vertical;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.5;
    background: #fafafe;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }
  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.primary:disabled {
    background: #a5b4fc;
    cursor: not-allowed;
  }
  .hint {
    font-size: 12px;
    color: var(--text-sub);
  }
  .result-box {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--en);
    color: var(--en-text);
    display: none;
  }
  .result-box.show { display: block; }
  .result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 19px;
    font-weight: 600;
  }
  .result-box .result-text { flex: 1; word-break: break-word; }
  .error-box {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #fef2f2;
    color: var(--danger);
    font-size: 13px;
    display: none;
  }
  .error-box.show { display: block; }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .history-header h2 {
    font-size: 16px;
    margin: 0;
  }
  .count-badge {
    font-size: 12px;
    color: var(--text-sub);
  }

  .day-group {
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--card);
  }
  .day-toggle {
    width: 100%;
    background: #fafbff;
    border: none;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }
  .day-toggle .meta {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .day-toggle .arrow {
    transition: transform .15s ease;
    display: inline-block;
  }
  .day-group.open .day-toggle .arrow { transform: rotate(90deg); }
  .day-body {
    display: none;
    padding: 4px 12px 12px;
  }
  .day-group.open .day-body { display: block; }

  .entry {
    display: flex;
    gap: 10px;
    padding: 10px 4px;
    border-top: 1px solid var(--border);
  }
  .entry:first-child { border-top: none; }
  .entry .time {
    flex: 0 0 52px;
    font-size: 11px;
    color: var(--text-sub);
    padding-top: 8px;
  }
  .entry .pair {
    flex: 1;
    min-width: 0;
  }
  .entry .ja, .entry .en {
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 4px;
    word-break: break-word;
  }
  .entry .ja { background: var(--ja); color: var(--ja-text); }
  .entry .en {
    background: var(--en);
    color: var(--en-text);
    font-size: 17px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .entry .en .en-text { flex: 1; }
  .en-actions, .result-actions {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .speak-btn, .copy-btn, .explain-btn {
    flex: 0 0 auto;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
    padding: 2px 4px;
    color: var(--en-text);
  }
  .speak-btn:hover, .copy-btn:hover, .explain-btn:hover { opacity: .65; }
  .speak-btn:disabled, .copy-btn:disabled, .explain-btn:disabled { opacity: .5; cursor: default; }
  .no-tts .speak-btn { display: none; }

  .explain-panel {
    display: none;
    margin-top: 8px;
    padding: 10px 12px;
    background: #f8f9ff;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text);
  }
  .explain-panel.open { display: block; }
  .explain-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  .explain-item {
    padding: 6px 0;
    border-top: 1px solid var(--border);
  }
  .explain-item:first-of-type { border-top: none; padding-top: 0; }
  .explain-word-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
  }
  .explain-word { font-weight: 700; color: var(--accent-dark); }
  .explain-pos {
    font-size: 11px;
    color: var(--text-sub);
    background: #eef0f4;
    padding: 1px 7px;
    border-radius: 999px;
  }
  .explain-ja { font-size: 12px; color: var(--ja-text); }
  .explain-def { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .explain-loading, .explain-empty { color: var(--text-sub); font-size: 13px; }
  .entry .del {
    flex: 0 0 auto;
    background: none;
    border: none;
    color: #cbd5e1;
    cursor: pointer;
    font-size: 16px;
    padding: 4px 6px;
    align-self: flex-start;
  }
  .entry .del:hover { color: var(--danger); }

  .empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 13px;
    padding: 30px 10px;
  }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: spin .7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>📝 翻訳記録表 <span class="version-badge" title="更新履歴はHTMLソース先頭のコメントを参照">v1.7</span></h1>
  <p class="subtitle">日本語を入力して翻訳すると、日付ごとに記録が残ります</p>

  <div class="card">
    <label for="jaInput">日本語で入力</label>
    <textarea id="jaInput" placeholder="例）暑いね"></textarea>
    <div class="actions">
      <button class="primary" id="translateBtn" type="button">翻訳する</button>
      <span class="hint">Enterキーで翻訳できます</span>
    </div>
    <div class="result-box" id="resultBox"></div>
    <div class="error-box" id="errorBox"></div>
  </div>

  <div class="history-header">
    <h2>記録一覧</h2>
    <span class="count-badge" id="countBadge"></span>
  </div>
  <div id="historyList"></div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'translationLogRecords_v1';
  const jaInput = document.getElementById('jaInput');
  const translateBtn = document.getElementById('translateBtn');
  const resultBox = document.getElementById('resultBox');
  const errorBox = document.getElementById('errorBox');
  const historyList = document.getElementById('historyList');
  const countBadge = document.getElementById('countBadge');

  // openState keeps track of which date groups are expanded across re-renders
  const openState = {};

  function loadRecords() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error('failed to load records', e);
      return [];
    }
  }

  function saveRecords(records) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function dateKey(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function formatDateLabel(key) {
    const [y, m, d] = key.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
    const todayKey = dateKey(new Date());
    const yestKey = dateKey(new Date(Date.now() - 86400000));
    let suffix = '';
    if (key === todayKey) suffix = '（今日）';
    else if (key === yestKey) suffix = '（昨日）';
    return `${y}年${m}月${d}日（${weekdays[dt.getDay()]}）${suffix}`;
  }

  function formatTime(d) {
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function render() {
    const records = loadRecords();
    countBadge.textContent = records.length ? `全 ${records.length} 件` : '';

    if (!records.length) {
      historyList.innerHTML = '<div class="empty">まだ記録がありません。翻訳すると、ここに一覧が表示されます。</div>';
      return;
    }

    // group by date
    const groups = {};
    records.forEach((r) => {
      if (!groups[r.dateKey]) groups[r.dateKey] = [];
      groups[r.dateKey].push(r);
    });

    const sortedKeys = Object.keys(groups).sort((a, b) => (a < b ? 1 : -1));

    // default: open the most recent day if openState is empty
    if (Object.keys(openState).length === 0 && sortedKeys.length) {
      openState[sortedKeys[0]] = true;
    }

    historyList.innerHTML = sortedKeys.map((key) => {
      const items = groups[key].sort((a, b) => b.timestamp - a.timestamp);
      const isOpen = !!openState[key];
      const entriesHtml = items.map((r) => `
        <div class="entry" data-id="${r.id}">
          <div class="time">${formatTime(new Date(r.timestamp))}</div>
          <div class="pair">
            <div class="ja">🇯🇵 ${escapeHtml(r.ja)}</div>
            <div class="en">
              <span class="en-text">🇬🇧 ${escapeHtml(r.en)}</span>
              <span class="en-actions">
                <button class="speak-btn" type="button" data-speak="${escapeHtml(r.en)}" title="読み上げ">🔊</button>
                <button class="copy-btn" type="button" data-copy="${escapeHtml(r.en)}" title="コピー">📋</button>
                <button class="explain-btn" type="button" data-explain="${escapeHtml(r.en)}" data-target="explain-${r.id}" title="単語の意味を見る">📖</button>
              </span>
            </div>
            <div class="explain-panel" id="explain-${r.id}"></div>
          </div>
          <button class="del" title="削除" data-del="${r.id}">✕</button>
        </div>
      `).join('');

      return `
        <div class="day-group ${isOpen ? 'open' : ''}" data-key="${key}">
          <button class="day-toggle" data-toggle="${key}">
            <span>${formatDateLabel(key)}</span>
            <span class="meta">${items.length} 件 <span class="arrow">▶</span></span>
          </button>
          <div class="day-body">${entriesHtml}</div>
        </div>
      `;
    }).join('');

    // wire up toggle + delete
    historyList.querySelectorAll('[data-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-toggle');
        openState[key] = !openState[key];
        render();
      });
    });
    historyList.querySelectorAll('[data-del]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-del');
        const remaining = loadRecords().filter((r) => String(r.id) !== String(id));
        saveRecords(remaining);
        render();
      });
    });
    historyList.querySelectorAll('[data-speak]').forEach((btn) => {
      btn.addEventListener('click', () => speakEnglish(btn.getAttribute('data-speak')));
    });
    historyList.querySelectorAll('[data-copy]').forEach((btn) => {
      btn.addEventListener('click', () => copyText(btn.getAttribute('data-copy'), btn));
    });
    historyList.querySelectorAll('[data-explain]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const text = btn.getAttribute('data-explain');
        const panel = document.getElementById(btn.getAttribute('data-target'));
        handleExplainClick(btn, text, panel);
      });
    });
  }

  async function copyText(text, btn) {
    if (!text) return;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        // クリップボードAPIが使えない環境向けのフォールバック
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      flashCopied(btn);
    } catch (e) {
      console.error('copy failed', e);
    }
  }

  function flashCopied(btn) {
    if (!btn) return;
    const original = btn.textContent;
    btn.textContent = '✅';
    btn.disabled = true;
    setTimeout(() => {
      btn.textContent = original;
      btn.disabled = false;
    }, 1200);
  }

  const ttsSupported = 'speechSynthesis' in window;
  if (!ttsSupported) document.body.classList.add('no-tts');

  function speakEnglish(text) {
    if (!ttsSupported || !text) return;
    window.speechSynthesis.cancel(); // 前の読み上げが残っていたら止めてから話す
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.95;
    window.speechSynthesis.speak(utter);
  }

  // ---- 単語の意味（解説）機能 ----
  // 文法・熟語の"深い"解説ではなく、文中の主な単語について
  // 英英辞書の意味＋簡易的な日本語訳を表示する簡易版。
  const EXPLAIN_STOPWORDS = new Set([
    'a', 'an', 'the', 'is', 'am', 'are', 'was', 'were', 'to', 'of', 'in', 'on', 'at',
    'it', 'i', 'you', 'he', 'she', 'we', 'they', 'this', 'that', 'and', 'or', 'as'
  ]);

  function tokenizeForExplain(text) {
    const raw = (text || '').split(/\s+/);
    const seen = new Set();
    const words = [];
    raw.forEach((tok) => {
      const cleaned = tok.replace(/^[^a-zA-Z']+|[^a-zA-Z']+$/g, '');
      if (!cleaned) return;
      const lower = cleaned.toLowerCase();
      if (EXPLAIN_STOPWORDS.has(lower)) return;
      if (seen.has(lower)) return;
      seen.add(lower);
      words.push(cleaned);
    });
    return words.slice(0, 10); // 多くなりすぎないよう最大10語まで
  }

  async function fetchWordInfo(word) {
    const lower = word.toLowerCase();
    const [dictResult, jaResult] = await Promise.allSettled([
      fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
        .then((r) => (r.ok ? r.json() : null)),
      translateEnToJa(word),
    ]);

    let pos = '';
    let definition = '';
    if (dictResult.status === 'fulfilled' && Array.isArray(dictResult.value) && dictResult.value[0]) {
      const meanings = dictResult.value[0].meanings || [];
      if (meanings[0]) {
        pos = meanings[0].partOfSpeech || '';
        const def = meanings[0].definitions && meanings[0].definitions[0];
        if (def) definition = def.definition || '';
      }
    }
    const ja = jaResult.status === 'fulfilled' ? jaResult.value : '';
    return { word, pos, definition, ja };
  }

  function renderExplainList(infos) {
    const items = infos.map((info) => {
      const posLabel = info.pos ? `<span class="explain-pos">${escapeHtml(info.pos)}</span>` : '';
      const jaLabel = info.ja ? `<span class="explain-ja">${escapeHtml(info.ja)}</span>` : '';
      const defLine = info.definition ? `<div class="explain-def">${escapeHtml(info.definition)}</div>` : '';
      return `
        <div class="explain-item">
          <div class="explain-word-row">
            <span class="explain-word">${escapeHtml(info.word)}</span>
            ${posLabel}
            ${jaLabel}
          </div>
          ${defLine}
        </div>
      `;
    }).join('');
    return `<div class="explain-title">📖 主な単語の意味（英英辞書＋簡易訳）</div>${items}`;
  }

  async function handleExplainClick(btn, text, panel) {
    if (!panel) return;
    const isOpen = panel.classList.contains('open');
    if (isOpen) {
      panel.classList.remove('open');
      return;
    }
    panel.classList.add('open');
    if (panel.dataset.loaded === '1') return; // 取得済みなら再取得せず表示するだけ

    panel.innerHTML = '<div class="explain-loading"><span class="spinner"></span>解説を取得中…</div>';
    btn.disabled = true;
    try {
      const words = tokenizeForExplain(text);
      if (!words.length) {
        panel.innerHTML = '<div class="explain-empty">解説できる単語が見つかりませんでした</div>';
      } else {
        const infos = await Promise.all(
          words.map((w) => fetchWordInfo(w).catch(() => ({ word: w, pos: '', definition: '', ja: '' })))
        );
        panel.innerHTML = renderExplainList(infos);
      }
      panel.dataset.loaded = '1';
    } catch (e) {
      console.error('explain failed', e);
      panel.innerHTML = '<div class="explain-empty">解説の取得に失敗しました</div>';
    } finally {
      btn.disabled = false;
    }
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function clearError() {
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  }
  function showResult(text) {
    resultBox.innerHTML = `
      <div class="result-row">
        <span class="result-text">🇬🇧 ${escapeHtml(text)}</span>
        <span class="result-actions">
          <button class="speak-btn" type="button" id="resultSpeakBtn" title="読み上げ">🔊</button>
          <button class="copy-btn" type="button" id="resultCopyBtn" title="コピー">📋</button>
          <button class="explain-btn" type="button" id="resultExplainBtn" title="単語の意味を見る">📖</button>
        </span>
      </div>
      <div class="explain-panel" id="resultExplainPanel"></div>
    `;
    resultBox.classList.add('show');
    const speakBtn = document.getElementById('resultSpeakBtn');
    if (speakBtn) speakBtn.addEventListener('click', () => speakEnglish(text));
    const copyBtn = document.getElementById('resultCopyBtn');
    if (copyBtn) copyBtn.addEventListener('click', () => copyText(text, copyBtn));
    const explainBtn = document.getElementById('resultExplainBtn');
    const explainPanel = document.getElementById('resultExplainPanel');
    if (explainBtn) explainBtn.addEventListener('click', () => handleExplainClick(explainBtn, text, explainPanel));
  }

  async function translateText(text, sl, tl) {
    // Google翻訳と同じ翻訳エンジンを使う無料の仕組み（APIキー不要）。
    // レスポンスは入れ子の配列形式で返ってくる。
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + sl + '&tl=' + tl + '&dt=t&q=' + encodeURIComponent(text);
    const res = await fetch(url);
    if (!res.ok) throw new Error('翻訳サーバーへの接続に失敗しました（HTTP ' + res.status + '）');
    const data = await res.json();
    if (!data || !Array.isArray(data[0])) {
      throw new Error('翻訳結果を取得できませんでした');
    }
    const translated = data[0].map((segment) => (segment && segment[0]) || '').join('');
    if (!translated) {
      throw new Error('翻訳結果を取得できませんでした');
    }
    return translated;
  }

  async function translateJaToEn(text) { return translateText(text, 'ja', 'en'); }
  async function translateEnToJa(text) { return translateText(text, 'en', 'ja'); }

  async function handleTranslate() {
    const text = jaInput.value.trim();
    clearError();
    resultBox.classList.remove('show');
    if (!text) {
      showError('日本語を入力してください');
      return;
    }

    translateBtn.disabled = true;
    translateBtn.innerHTML = '<span class="spinner"></span>翻訳中…';

    try {
      const en = await translateJaToEn(text);
      showResult(en);

      const now = new Date();
      const records = loadRecords();
      records.push({
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        ja: text,
        en: en,
        dateKey: dateKey(now),
        timestamp: now.getTime(),
      });
      saveRecords(records);

      // make sure today's group is expanded so the new entry is visible
      openState[dateKey(now)] = true;

      jaInput.value = '';
      render();
    } catch (err) {
      console.error(err);
      showError('翻訳に失敗しました。しばらくしてから再度お試しください。（' + err.message + '）');
    } finally {
      translateBtn.disabled = false;
      translateBtn.textContent = '翻訳する';
    }
  }

  translateBtn.addEventListener('click', handleTranslate);

  // スマホ(特に日本語IME)では、Enterキーを押したときに常にkeydownイベントが
  // 期待通り発火するとは限らないため、"beforeinput" + inputType が
  // 使える場合はそちらを優先して使う（IME変換確定のEnterでは insertLineBreak は
  // 発生しないため、変換確定と改行入力を自然に区別できる）。
  if (window.InputEvent && 'onbeforeinput' in jaInput) {
    jaInput.addEventListener('beforeinput', (e) => {
      if (e.inputType === 'insertLineBreak') {
        e.preventDefault();
        handleTranslate();
      }
    });
  } else {
    jaInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        handleTranslate();
      }
    });
  }

  render();

  // Register service worker so repeat visits load instantly from cache.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((e) => console.error('SW register failed', e));
    });
  }
})();
</script>
</body>
</html>
